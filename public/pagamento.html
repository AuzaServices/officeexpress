<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagamento - Office Express</title>
  <link rel="icon" href="/imagens/icon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/estilo.css" />
  <style>
    .qr-img { max-width: 230px; margin: 16px auto; display: none; background: #fff; padding: 10px; border-radius: 12px; }
    .copiar-pix { display: flex; gap: 8px; margin-top: 12px; }
    .copiar-pix input { flex: 1; }
  </style>
</head>
<body>
  <header class="cabecalho">
    <div class="container wrap">
      <a href="/"><img src="/imagens/logo.png" class="logo" alt="Office Express" onerror="this.style.display='none'" /></a>
      <nav class="menu" id="navMenu"></nav>
      <button class="hamburguer" id="hamburguer">&#9776;</button>
    </div>
  </header>
  <div id="mobileMenu"></div>

  <section class="section container">
    <div class="section-header">
      <h2>Pagamento</h2>
      <p id="resumo"></p>
    </div>

    <div class="pagamento-card card">
      <div id="alert" class="alert"></div>

      <div class="tabs">
        <button class="tab active" id="tabPix" onclick="ativarAba('pix')">Pix</button>
        <button class="tab" id="tabCard" onclick="ativarAba('card')">Cartão de crédito</button>
      </div>

      <!-- PIX -->
      <div id="abaPix" class="pix-box">
        <p>Escaneie o QR Code ou copie o código Pix para pagar. O currículo é liberado automaticamente após a confirmação.</p>
        <img id="qrImg" class="qr-img" alt="QR Code Pix" />
        <div class="copiar-pix" id="copiarArea" style="display:none">
          <input type="text" id="pixCode" readonly />
          <button class="btn btn-secondary" onclick="copiarPix()">Copiar</button>
        </div>
        <button class="btn btn-primary" id="btnGerarPix" onclick="gerarPix()">Gerar Pix</button>
        <div class="status-pag" id="statusPix"></div>
      </div>

      <!-- CARTÃO -->
      <div id="abaCard" style="display:none">
        <p style="color:var(--text-muted);margin-bottom:16px">Preencha os dados do cartão. Seus dados são processados com segurança pelo Mercado Pago.</p>
        <div id="cardForm">
          <div class="campo"><label>Número do cartão</label><input id="cardNumber" inputmode="numeric" placeholder="0000 0000 0000 0000" /></div>
          <div class="campo"><label>Nome no cartão</label><input id="cardHolder" placeholder="Como está no cartão" /></div>
          <div class="campo" style="display:flex;gap:12px">
            <div style="flex:1"><label>Validade</label><input id="cardExp" placeholder="MM/AA" /></div>
            <div style="flex:1"><label>CVV</label><input id="cardCvv" inputmode="numeric" placeholder="123" /></div>
          </div>
          <button class="btn btn-primary btn-block" id="btnPagarCard" onclick="pagarCartao()">Pagar</button>
        </div>
        <div class="status-pag" id="statusCard"></div>
      </div>
    </div>
  </section>

  <footer class="footer"><div class="container"><p>&copy; <span id="ano"></span> Office Express</p></div></footer>

  <script src="/assets/app.js"></script>
  <script src="https://sdk.mercadopago.com/js/v2"></script>
  <script>
    var pedidoId = new URLSearchParams(window.location.search).get("pedido");
    var publicKey = "";
    var preco = 0;
    var mp = null;
    var pollTimer = null;

    document.getElementById("ano").textContent = new Date().getFullYear();
    App.carregarHeader("pagamento");

    if (!pedidoId) { App.mostrarAlerta("alert", "Pedido não identificado.", "error"); }

    // Config
    App.api("/api/config/pagamento").then(function (r) {
      if (r.ok) {
        publicKey = r.data.publicKey;
        preco = r.data.preco;
        document.getElementById("resumo").textContent = "Valor a pagar: " + App.formatarPreco(preco) + " (PDF + Word)";
        if (window.MercadoPago && publicKey) {
          mp = new MercadoPago(publicKey, { locale: "pt-BR" });
        }
      }
    });

    function ativarAba(aba) {
      document.getElementById("abaPix").style.display = aba === "pix" ? "block" : "none";
      document.getElementById("abaCard").style.display = aba === "card" ? "block" : "none";
      document.getElementById("tabPix").classList.toggle("active", aba === "pix");
      document.getElementById("tabCard").classList.toggle("active", aba === "card");
    }
    window.ativarAba = ativarAba;

    // ---------- PIX ----------
    async function gerarPix() {
      App.limparAlerta("alert");
      var btn = document.getElementById("btnGerarPix");
      btn.disabled = true; btn.textContent = "Gerando...";
      var { ok, data } = await App.api("/api/pagamento/pix", { method: "POST", body: JSON.stringify({ pedidoId: Number(pedidoId) }) });
      btn.disabled = false; btn.textContent = "Gerar Pix";
      if (!ok) { App.mostrarAlerta("alert", data.error || "Erro ao gerar Pix.", "error"); return; }
      if (data.qr_code_base64) {
        document.getElementById("qrImg").src = "data:image/png;base64," + data.qr_code_base64;
      }
      document.getElementById("qrImg").style.display = "block";
      document.getElementById("pixCode").value = data.qr_code || "";
      document.getElementById("copiarArea").style.display = "flex";
      document.getElementById("statusPix").textContent = "Aguardando pagamento...";
      iniciarPolling(data.id);
    }
    window.gerarPix = gerarPix;

    function copiarPix() {
      var el = document.getElementById("pixCode");
      el.select(); document.execCommand("copy");
      alert("Código Pix copiado!");
    }
    window.copiarPix = copiarPix;

    function iniciarPolling(pagamentoId) {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async function () {
        var { ok, data } = await App.api("/api/pagamento/status/" + pagamentoId);
        if (ok && data.status === "approved") {
          clearInterval(pollTimer);
          await App.api("/api/pedidos/" + pedidoId + "/confirmar-pago", { method: "POST", body: JSON.stringify({ pagamentoId: String(pagamentoId), tipo: "pix" }) });
          window.location.href = "/sucesso?pedido=" + pedidoId;
        } else if (data.status === "rejected" || data.status === "cancelled") {
          clearInterval(pollTimer);
          document.getElementById("statusPix").textContent = "Pagamento não concluído. Tente novamente.";
        }
      }, 4000);
    }

    // ---------- CARTÃO ----------
    async function pagarCartao() {
      App.limparAlerta("alert");
      if (!mp) { App.mostrarAlerta("alert", "Erro ao carregar o processador de cartão. Tente o Pix.", "error"); return; }
      var statusCard = document.getElementById("statusCard");
      var btn = document.getElementById("btnPagarCard");
      btn.disabled = true; statusCard.textContent = "Processando...";

      var formData = {
        cardNumber: document.getElementById("cardNumber").value.replace(/\s/g, ""),
        cardExpirationMonth: document.getElementById("cardExp").value.split("/")[0],
        cardExpirationYear: "20" + document.getElementById("cardExp").value.split("/")[1],
        cardholderName: document.getElementById("cardHolder").value,
        securityCode: document.getElementById("cardCvv").value,
        identificationType: "CPF",
        identificationNumber: "00000000000"
      };

      try {
        var token = await mp.fields.createCardToken(formData);
        var { ok, data } = await App.api("/api/pagamento/cartao", {
          method: "POST",
          body: JSON.stringify({ pedidoId: Number(pedidoId), card_token: token.id, email: "" }),
        });
        if (ok && (data.status === "approved")) {
          await App.api("/api/pedidos/" + pedidoId + "/confirmar-pago", { method: "POST", body: JSON.stringify({ pagamentoId: String(data.id), tipo: "card" }) });
          window.location.href = "/sucesso?pedido=" + pedidoId;
        } else {
          statusCard.textContent = "";
          App.mostrarAlerta("alert", (data && data.error) || "Pagamento não aprovado. Verifique os dados do cartão.", "error");
        }
      } catch (err) {
        App.mostrarAlerta("alert", "Erro ao processar o cartão: " + (err.message || "verifique os dados."), "error");
      }
      btn.disabled = false;
    }
    window.pagarCartao = pagarCartao;
  </script>
</body>
</html>
