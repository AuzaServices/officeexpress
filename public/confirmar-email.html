<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmar e-mail - Office Express</title>
  <link rel="icon" href="/imagens/icon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/estilo.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card" style="text-align:center">
      <div class="auth-logo"><img src="/imagens/logo.png" alt="Office Express" onerror="this.style.display='none'" /></div>
      <h1>Confirmação de e-mail</h1>
      <div id="msg" style="margin:24px 0;color:var(--text-secondary)">Confirmando...</div>
      <a href="/login" class="btn btn-primary" id="btnIr" style="display:none">Ir para o login</a>
    </div>
  </div>

  <script src="/assets/app.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get("token");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btnIr");
    (async () => {
      if (!token) { msg.textContent = "Link inválido ou ausente."; btn.style.display = "inline-flex"; return; }
      const { ok, data } = await App.api("/api/auth/confirmar?token=" + encodeURIComponent(token));
      msg.textContent = ok ? (data.message || "E-mail confirmado com sucesso!") : (data.error || "Link inválido ou expirado.");
      btn.style.display = "inline-flex";
      btn.textContent = ok ? "Ir para o login" : "Voltar ao login";
    })();
  </script>
</body>
</html>
