<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmar e-mail - Office Express</title>
  <link rel="icon" href="/imagens/icon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/estilo.css" />
  <link rel="stylesheet" href="/assets/auth-premium.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-side">
      <img class="auth-side-img" src="/imagens/auth/confirmar.jpg" alt="" aria-hidden="true" onerror="this.onerror=null;this.src='/imagens/auth/login.jpg';" />
      <div class="auth-side-overlay"></div>
      <div class="auth-side-content">
        <div class="auth-side-logo-row">
          <img class="auth-side-logo" src="/imagens/logo.png" alt="Office Express" onerror="this.style.display='none'" />
          <span class="auth-side-badge">Office Express</span>
        </div>
        <h2 class="auth-side-headline">Falta pouco: <em>confirme</em> seu e-mail.</h2>
        <p class="auth-side-text">Digite o código de 4 dígitos que enviamos para liberar o acesso à sua conta.</p>
        <ul class="auth-side-feats">
          <li><span class="feat-ico">✉️</span>Código enviado ao seu e-mail</li>
          <li><span class="feat-ico">⏱️</span>Confirmação em segundos</li>
          <li><span class="feat-ico">🚀</span>Acesso liberado na hora</li>
        </ul>
      </div>
    </div>
    <div class="auth-form-panel">
    <div class="auth-card" style="text-align:center">

      <a class="auth-home-btn" href="/" aria-label="Voltar para a página inicial" title="Voltar para a home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5"/>
          <path d="M5 9.5V21h14V9.5"/>
          <path d="M10 21v-6h4v6"/>
        </svg>
      </a>
      <div class="auth-logo"><img src="/imagens/logo.png" alt="Office Express" onerror="this.style.display='none'" /></div>
      <h1 id="titulo">Confirmando seu e-mail…</h1>
      <p class="subtitle" id="texto">Aguarde um instante.</p>
      <div id="alert" class="alert"></div>
      <div class="auth-links" id="links" style="display:none">
        <p><a href="/login">Ir para o login</a></p>
      </div>
    </div>
    </div><!-- /.auth-form-panel -->
  </div><!-- /.auth-page -->

  <script src="/assets/app.js"></script>
  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");
      if (!token) {
        document.getElementById("titulo").textContent = "Link inválido";
        document.getElementById("texto").textContent = "Nenhum token de confirmação foi informado.";
        document.getElementById("links").style.display = "block";
        return;
      }
      const { ok, data } = await App.api("/api/auth/confirmar?token=" + encodeURIComponent(token));
      if (ok) {
        document.getElementById("titulo").textContent = "E-mail confirmado!";
        document.getElementById("texto").textContent = "Redirecionando para a escolha de modelos…";
        App.mostrarAlerta("alert", "Tudo certo! Você já pode escolher seu modelo de currículo.", "success");
        setTimeout(function () {
          var destino = localStorage.getItem("redirectAposLogin");
          localStorage.removeItem("redirectAposLogin");
          window.location.href = destino || "/modelos";
        }, 1500);
      } else {
        document.getElementById("titulo").textContent = "Não foi possível confirmar";
        document.getElementById("texto").textContent = "";
        App.mostrarAlerta("alert", data.error || "Link inválido ou expirado.", "error");
        document.getElementById("links").style.display = "block";
      }
    })();
  </script>
</body>
</html>
