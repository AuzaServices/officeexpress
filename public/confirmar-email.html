<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmar e-mail - Office Express</title>
  <link rel="icon" href="/imagens/icon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/estilo.css" />
  <link rel="stylesheet" href="/assets/auth-premium.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-side">
      <img class="auth-side-img" src="/imagens/auth/confirmar.jpg" alt="" aria-hidden="true" onerror="this.onerror=null;this.src='/imagens/auth/login.jpg';" />
      <div class="auth-side-overlay"></div>
      <div class="auth-side-content">
        <h2 class="auth-side-headline">Falta pouco: <em>confirme</em> seu e-mail.</h2>
        <p class="auth-side-text">Digite o código de 4 dígitos que enviamos para liberar o acesso à sua conta.</p>
        <ul class="auth-side-feats">
          <li><span class="feat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>Código enviado ao seu e-mail</li>
          <li><span class="feat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M9 2h6"/></svg></span>Confirmação em segundos</li>
          <li><span class="feat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg></span>Acesso liberado na hora</li>
        </ul>
      </div>
    </div>
    <div class="auth-form-panel">
    <div class="auth-card" style="text-align:center">
      <a class="auth-voltar" href="/" aria-label="Voltar para a página inicial">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        Voltar ao site
      </a>

      <h1 id="titulo">Confirmando seu e-mail…</h1>
      <p class="subtitle" id="texto">Aguarde um instante.</p>
      <div id="alert" class="alert"></div>
      <div class="auth-links" id="links" style="display:none">
        <p><a href="/login">Ir para o login</a></p>
      </div>
    </div>
    </div><!-- /.auth-form-panel -->
  </div><!-- /.auth-page -->

  <script src="/assets/app.js"></script>
  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");
      if (!token) {
        document.getElementById("titulo").textContent = "Link inválido";
        document.getElementById("texto").textContent = "Nenhum token de confirmação foi informado.";
        document.getElementById("links").style.display = "block";
        return;
      }
      const { ok, data } = await App.api("/api/auth/confirmar?token=" + encodeURIComponent(token));
      if (ok) {
        document.getElementById("titulo").textContent = "E-mail confirmado!";
        document.getElementById("texto").textContent = "Redirecionando para a escolha de modelos…";
        App.mostrarAlerta("alert", "Tudo certo! Você já pode escolher seu modelo de currículo.", "success");
        setTimeout(function () {
          var destino = localStorage.getItem("redirectAposLogin");
          localStorage.removeItem("redirectAposLogin");
          window.location.href = destino || "/modelos";
        }, 1500);
      } else {
        document.getElementById("titulo").textContent = "Não foi possível confirmar";
        document.getElementById("texto").textContent = "";
        App.mostrarAlerta("alert", data.error || "Link inválido ou expirado.", "error");
        document.getElementById("links").style.display = "block";
      }
    })();
  </script>
</body>
</html>
