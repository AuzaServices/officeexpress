<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prévia da carta | Office Express</title>
<link rel="icon" href="/imagens/icon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/estilo.css">
<style>
  .carta-preview-page{padding:120px 0 90px}
  .carta-preview-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:30px;align-items:start}
  .carta-sheet{background:#fff;color:#253746;max-width:794px;min-height:900px;margin:auto;padding:72px;box-shadow:0 22px 55px rgba(14,43,68,.18);border-radius:8px}
  .carta-side{position:sticky;top:90px;padding:24px}
  .carta-side h2{font-size:1.1rem;margin-bottom:8px}
  .carta-side p{color:var(--text-muted);font-size:.88rem;margin-bottom:22px}
  .carta-side .btn{width:100%;margin-bottom:10px}
  @media(max-width:800px){
    .carta-preview-page{padding-top:96px}
    .carta-preview-layout{grid-template-columns:1fr}
    .carta-sheet{padding:34px 26px;min-height:650px}
    .carta-side{position:static}
    .carta-side .btn{margin-bottom:0}
    .carta-side-actions{display:grid;gap:10px}
  }
</style>
</head>
<body>
<header class="cabecalho">
  <div class="container wrap">
    <a href="/"><img src="/imagens/logo.png" class="logo" alt="Office Express"></a>
    <nav class="menu" id="navMenu"></nav>
    <button class="hamburguer" id="hamburguer" aria-label="Abrir menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
</header>
<div id="mobileMenu"></div>
<main class="carta-preview-page">
  <section class="container" data-reveal>
    <div class="section-header">
      <span style="color:var(--brand-dark);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem">Confira antes de continuar</span>
      <h1>Prévia da sua carta</h1>
      <p>Revise o conteúdo e escolha continuar para autenticação e pagamento.</p>
    </div>
    <div class="carta-preview-layout">
      <article class="carta-sheet" id="cartaSheet"><!-- conteúdo renderizado pelo modelo escolhido --></article>
      <aside class="card carta-side">
        <h2>Gostou do resultado?</h2>
        <p>Depois do pagamento, você poderá baixar sua carta em PDF.</p>
        <div class="carta-side-actions">
          <button class="btn btn-primary" id="continuarPagamento">Continuar para pagamento</button>
          <button class="btn btn-secondary" id="voltarEditor">Editar respostas</button>
          <button class="btn btn-ghost" id="trocarModelo">Trocar modelo</button>
        </div>
      </aside>
    </div>
  </section>
</main>
<script src="/assets/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  App.carregarHeader('preview2');

  var dados = {};
  try { dados = JSON.parse(localStorage.getItem('cartaDados') || '{}'); } catch (e) {}
  var modelo = localStorage.getItem('cartaSelecionada') || 'moderna';
  var sheet = document.getElementById('cartaSheet');

  // Renderiza a carta no servidor aplicando o layout visual do modelo escolhido,
  // de forma consistente com o PDF que será gerado.
  App.api('/api/cartas/previa', {
    method: 'POST',
    body: JSON.stringify({ modelo: modelo, dados: dados }),
  }).then(function (r) {
    if (r.ok && r.data && r.data.html) {
      sheet.innerHTML = r.data.html;
    } else {
      // Fallback: monta uma prévia simples local caso a renderização falhe.
      montarPreviaLocal(sheet, dados, modelo);
    }
  }).catch(function () {
    montarPreviaLocal(sheet, dados, modelo);
  });

  function esc(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function montarPreviaLocal(el, dados, modelo) {
    var nome = esc(dados.nome || 'Seu nome');
    var cargo = esc(dados.cargo || 'a oportunidade');
    var empresa = esc(dados.empresa || 'sua empresa');
    var dest = dados.destinatario ? esc('Prezado(a) ' + dados.destinatario + ',') : 'Prezado(a) recrutador(a),';
    var contato = [esc(dados.email), esc(dados.telefone), esc(dados.cidade)].filter(Boolean).join('  |  ');
    el.innerHTML =
      '<div style="border-bottom:3px solid #0e7490;padding-bottom:14px;margin-bottom:22px">' +
        '<div style="font-size:25px;font-weight:800;color:#0e7490">' + nome + '</div>' +
        '<div style="font-size:11px;margin-top:6px;color:#64748b">' + contato + '</div>' +
      '</div>' +
      '<p style="font:15px/1.85 Georgia,serif;margin:0 0 18px">' + dest + '</p>' +
      '<p style="font:15px/1.85 Georgia,serif;margin:0 0 18px">' + esc(dados.motivacao || 'Tenho interesse na oportunidade de ' + cargo + ' na ' + empresa + '.') + '</p>' +
      '<p style="font:15px/1.85 Georgia,serif;margin:0 0 18px">' + esc(dados.experiencia || 'Desenvolvi competências importantes para a posição e aprendi a transformar desafios em entregas consistentes.') + '</p>' +
      '<p style="font:15px/1.85 Georgia,serif;margin:0 0 18px">' + esc(dados.diferenciais || 'Entre meus diferenciais estão aprender rapidamente e manter foco em resultados de qualidade.') + '</p>' +
      '<p style="font:15px/1.85 Georgia,serif;margin:0 0 18px">Gostaria de conversar sobre como posso contribuir. Agradeço a atenção e fico à disposição.</p>' +
      '<div style="font:15px/1.6 Georgia,serif">Atenciosamente,</div>' +
      '<div style="font:700 15px/1.6 Georgia,serif;color:#0e7490;margin-top:6px">' + nome + '</div>';
  }

  document.getElementById('continuarPagamento').onclick = async function () {
    var u = await App.authMe();
    if (!u) {
      localStorage.setItem('cartaPendente', JSON.stringify({ modelo: localStorage.getItem('cartaSelecionada') || 'moderna', dados: dados }));
      localStorage.setItem('redirectAposLogin', '/preview2');
      location.href = '/login';
      return;
    }
    var r = await App.api('/api/pedidos', {
      method: 'POST',
      body: JSON.stringify({ tipo: 'carta', modelo: localStorage.getItem('cartaSelecionada') || 'moderna', dados: dados, ref: App.obterRef() }),
    });
    if (r.ok) location.href = '/pagamento?pedido=' + r.data.pedido.id;
    else alert(r.data.error || 'Não foi possível criar o pedido.');
  };
  document.getElementById('voltarEditor').onclick = function () { location.href = '/editor2'; };
  document.getElementById('trocarModelo').onclick = function () { location.href = '/cartas'; };
});
</script>
</body>
</html>
