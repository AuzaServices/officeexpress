<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia da carta | Office Express</title><link rel="icon" href="/imagens/icon.png" type="image/png"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/estilo.css"><style>.carta-preview-page{padding:120px 0 90px}.carta-preview-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:30px;align-items:start}.carta-sheet{background:#fff;color:#253746;max-width:794px;min-height:900px;margin:auto;padding:72px;box-shadow:0 22px 55px rgba(14,43,68,.18);border-radius:8px}.carta-sheet h1{color:#00324a;font:700 28px Georgia,serif;border-bottom:3px solid var(--brand);padding-bottom:16px;margin-bottom:10px}.carta-meta{color:#64748b;font-size:12px;margin-bottom:60px}.carta-sheet p{font:15px/1.8 Georgia,serif;margin:0 0 20px}.carta-side{position:sticky;top:90px;padding:24px}.carta-side h2{font-size:1.1rem;margin-bottom:8px}.carta-side p{color:var(--text-muted);font-size:.88rem;margin-bottom:22px}.carta-side .btn{width:100%;margin-bottom:10px}@media(max-width:800px){.carta-preview-page{padding-top:96px}.carta-preview-layout{grid-template-columns:1fr}.carta-sheet{padding:34px 26px;min-height:650px}.carta-side{position:static}.carta-side .btn{margin-bottom:0}.carta-side-actions{display:grid;gap:10px}} </style></head>
<body><header class="cabecalho"><div class="container wrap"><a href="/"><img src="/imagens/logo.png" class="logo" alt="Office Express"></a><nav class="menu" id="navMenu"></nav><button class="hamburguer" id="hamburguer" aria-label="Abrir menu" aria-expanded="false"><span></span><span></span><span></span></button></div></header><div id="mobileMenu"></div><main class="carta-preview-page"><section class="container" data-reveal><div class="section-header"><span style="color:var(--brand-dark);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem">Confira antes de continuar</span><h1>Prévia da sua carta</h1><p>Revise o conteúdo e escolha continuar para autenticação e pagamento.</p></div><div class="carta-preview-layout"><article class="carta-sheet" id="cartaSheet"><h1 id="cartaNome">Sua carta de apresentação</h1><div class="carta-meta" id="cartaMeta"></div><div id="cartaTexto"></div></article><aside class="card carta-side"><h2>Gostou do resultado?</h2><p>Depois do pagamento, você poderá baixar sua carta em PDF.</p><div class="carta-side-actions"><button class="btn btn-primary" id="continuarPagamento">Continuar para pagamento</button><button class="btn btn-secondary" id="voltarEditor">Editar respostas</button><button class="btn btn-ghost" id="trocarModelo">Trocar modelo</button></div></aside></div></section></main><script src="/assets/app.js"></script><script>document.addEventListener('DOMContentLoaded',function(){App.carregarHeader('preview2');var dados={};try{dados=JSON.parse(localStorage.getItem('cartaDados')||'{}')}catch(e){}var nome=dados.nome||'Seu nome',empresa=dados.empresa||'sua empresa',cargo=dados.cargo||'a oportunidade',dest=dados.destinatario?('Prezado(a) '+dados.destinatario+','):'Prezado(a) recrutador(a),';document.getElementById('cartaNome').textContent=nome;document.getElementById('cartaMeta').textContent=[dados.email,dados.telefone,dados.cidade].filter(Boolean).join('  |  ');document.getElementById('cartaTexto').innerHTML='<p>'+dest+'</p><p>'+(dados.motivacao||'Tenho interesse na oportunidade de '+cargo+' na '+empresa+'. Acredito que minha experiência e meu perfil podem contribuir de forma relevante para a equipe.')+'</p><p>'+(dados.experiencia||'Ao longo da minha trajetória, desenvolvi competências importantes para a posição e aprendi a transformar desafios em entregas consistentes.')+'</p><p>'+(dados.diferenciais||'Entre meus principais diferenciais estão a capacidade de aprender rapidamente, colaborar com diferentes equipes e manter foco em resultados de qualidade.')+'</p><p>Gostaria de conversar sobre como posso contribuir para os objetivos da empresa. Agradeço a atenção e fico à disposição para uma entrevista.</p><p>Atenciosamente,<br><strong>'+nome+'</strong></p>';document.getElementById('continuarPagamento').onclick=async function(){var u=await App.authMe();if(!u){localStorage.setItem('cartaPendente',JSON.stringify({modelo:localStorage.getItem('cartaSelecionada')||'moderna',dados:dados}));localStorage.setItem('redirectAposLogin','/preview2');location.href='/login';return}var r=await App.api('/api/pedidos',{method:'POST',body:JSON.stringify({tipo:'carta',modelo:localStorage.getItem('cartaSelecionada')||'moderna',dados:dados})});if(r.ok)location.href='/pagamento?pedido='+r.data.pedido.id;else alert(r.data.error||'Não foi possível criar o pedido.')};document.getElementById('voltarEditor').onclick=function(){location.href='/editor2'};document.getElementById('trocarModelo').onclick=function(){location.href='/cartas'}});</script></body></html>
