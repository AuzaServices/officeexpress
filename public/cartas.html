<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modelos de cartas | Office Express</title><link rel="icon" href="/imagens/icon.png" type="image/png"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/estilo.css"><style>.cartas-hero{padding:132px 0 45px;text-align:center}.cartas-hero h1{font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.08;margin:14px 0}.cartas-hero p{max-width:680px;margin:auto;color:var(--text-secondary);font-size:1.08rem}.cartas-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding-bottom:88px}.carta-card{padding:0;overflow:hidden;cursor:pointer}.carta-card:focus-visible{outline:3px solid var(--brand);outline-offset:3px}.carta-preview{height:220px;padding:18px;background:#edf3f5;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center}.mini-carta{width:142px;height:190px;background:#fff;color:#334155;box-shadow:0 8px 18px rgba(14,43,68,.18);padding:18px 14px;position:relative;font-family:Georgia,serif;overflow:hidden}.mini-carta:after{content:'';position:absolute;left:14px;right:14px;bottom:18px;height:37px;background:repeating-linear-gradient(to bottom,#cbd5e1 0 2px,transparent 2px 9px);opacity:.85}.mini-nome{font-size:13px;font-weight:bold;color:#00324a;border-bottom:2px solid #ff8800;padding-bottom:7px;margin-bottom:7px}.mini-meta{font:6px Inter,sans-serif;color:#64748b;margin-bottom:18px}.mini-linhas{height:62px;background:repeating-linear-gradient(to bottom,#94a3b8 0 2px,transparent 2px 10px);opacity:.7}.mini-carta.criativa{border-top:7px solid #ea580c}.mini-carta.criativa .mini-nome{color:#ea580c;border-color:#ea580c}.mini-carta.tecnica{border-left:7px solid #0e7490}.mini-carta.tecnica .mini-nome{color:#0e7490;border-color:#0e7490}.mini-carta.lideranca{border-top:7px solid #1e3a5f}.mini-carta.lideranca .mini-nome{color:#1e3a5f;border-color:#1e3a5f}.mini-carta.primeiro-emprego{border-top:7px solid #16a34a}.mini-carta.primeiro-emprego .mini-nome{color:#15803d;border-color:#16a34a}.mini-carta.transicao{border-left:7px solid #7c3aed}.mini-carta.transicao .mini-nome{color:#6d28d9;border-color:#7c3aed}.mini-carta.estagio{border-top:7px solid #0284c7}.mini-carta.estagio .mini-nome{color:#0369a1;border-color:#0284c7}.mini-carta.academica{border-top:7px solid #7f1d1d}.mini-carta.academica .mini-nome{color:#7f1d1d;border-color:#7f1d1d}.mini-carta.comercial{border-left:7px solid #d97706}.mini-carta.comercial .mini-nome{color:#b45309;border-color:#d97706}.mini-carta.startup{border-top:7px solid #db2777}.mini-carta.startup .mini-nome{color:#be185d;border-color:#db2777}.mini-carta.formal{border:1px solid #334155}.mini-carta.formal .mini-nome{color:#111827;border-color:#334155}.mini-carta.internacional{border-top:7px solid #2563eb}.mini-carta.internacional .mini-nome{color:#1d4ed8;border-color:#2563eb}.mini-carta.recolocacao{border-left:7px solid #059669}.mini-carta.recolocacao .mini-nome{color:#047857;border-color:#059669}.mini-carta.networking{border-top:7px solid #9333ea}.mini-carta.networking .mini-nome{color:#7e22ce;border-color:#9333ea}.carta-body{padding:22px}.carta-body h2{font-size:1.15rem;margin-bottom:7px}.carta-body p{color:var(--text-muted);font-size:.9rem;min-height:44px}.carta-body .btn{margin-top:18px;width:100%}@media(max-width:850px){.cartas-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.cartas-hero{padding-top:104px}.cartas-grid{grid-template-columns:1fr;max-width:390px;margin:auto}}</style></head>
<body><header class="cabecalho"><div class="container wrap"><a href="/"><img src="/imagens/logo.png" class="logo" alt="Office Express"></a><nav class="menu" id="navMenu"></nav><button class="hamburguer" id="hamburguer" aria-label="Abrir menu" aria-expanded="false"><span></span><span></span><span></span></button></div></header><div id="mobileMenu"></div><main><section class="cartas-hero" data-reveal><div class="container"><span style="color:var(--brand-dark);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem">Ferramentas profissionais</span><h1>Uma carta que abre a <span style="color:var(--brand-dark)">conversa.</span></h1><p>Escolha um estilo e responda perguntas estratégicas. O Office Express transforma sua história em uma carta específica para a vaga.</p></div></section><section class="container cartas-grid" id="cartasGrid" data-reveal></section></main><script src="/assets/app.js"></script><script>document.addEventListener('DOMContentLoaded',function(){App.carregarHeader('cartas');App.api('/api/cartas').then(function(r){var grid=document.getElementById('cartasGrid');if(!r.ok){grid.innerHTML='<p>Não foi possível carregar os modelos.</p>';return}r.data.cartas.forEach(function(c){var card=document.createElement('article');card.className='card carta-card';card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label','Usar modelo de carta '+c.nome);card.innerHTML='<div class="carta-preview" aria-hidden="true"><div class="mini-carta '+c.id+'"><div class="mini-nome">Ana Martins</div><div class="mini-meta">ana@email.com · Fortaleza, CE</div><div class="mini-linhas"></div></div></div><div class="carta-body"><h2>'+c.nome+'</h2><p>'+c.descricao+'</p><button class="btn btn-primary" type="button">Usar este modelo</button></div>';function selecionar(){localStorage.setItem('cartaSelecionada',c.id);localStorage.setItem('cartaNome',c.nome);location.href='/editor2'}card.addEventListener('click',selecionar);card.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();selecionar()}});grid.appendChild(card)})})});</script></body></html>
