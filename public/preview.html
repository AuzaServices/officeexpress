<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pré-visualização - Office Express</title>
  <link rel="icon" href="/imagens/icon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/estilo.css" />
  <script src="/curriculo-render.js"></script>
  <style>
    /* O preview renderiza o MESMO HTML/CSS do PDF (Opção C), escalado para caber. */
    .preview-page { padding: 48px 0 80px; }

    .preview-layout {
      display: grid; grid-template-columns: 1fr 300px; gap: 32px;
      align-items: start; max-width: 1180px; margin: 0 auto;
    }

    .preview-doc-col { min-width: 0; }
    .preview-paper {
      padding: 0; overflow: hidden; max-width: none; margin: 0; min-height: 0;
      border-radius: 10px; border: 1px solid var(--border);
      box-shadow: 0 20px 50px var(--shadow-lg);
    }
    .preview-doc { width: 794px; transform-origin: top left; background: #fff; }
    .preview-doc .page { width: 794px; min-height: 0; }

    /* Coluna de ações */
    .preview-acoes-col { position: static; }
    @media (min-width: 993px) {
      .preview-acoes-col { position: sticky; top: 96px; }
    }
    .preview-acoes-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 22px; box-shadow: 0 20px 45px var(--shadow-lg);
    }
    .preview-acoes-card h3 { margin: 0 0 4px; font-size: 1rem; font-weight: 700; color: var(--text-primary); }
    .preview-acoes-card .sub { margin: 0 0 20px; color: var(--text-muted); font-size: .85rem; }

    .preview-acoes { max-width: none; margin: 0; display: flex; flex-direction: column; gap: 12px; }
    .preview-acoes .btn { width: 100%; justify-content: center; }
    .preview-acoes .btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    @media (max-width: 992px) {
      .preview-layout { grid-template-columns: 1fr; gap: 20px; }
      .preview-acoes-card { max-width: 794px; margin: 0 auto; }
    }
    @media (max-width: 600px) {
      .preview-page { padding: 20px 0 40px; }
      .preview-page .container { padding: 0 14px; }
      .section-header { margin-bottom: 20px; }
      .section-header h2 { font-size: 1.4rem; }
      .section-header p { font-size: .85rem; }
      .preview-layout { gap: 16px; }
      .preview-doc-col { display: flex; justify-content: center; }
      .preview-paper { max-width: 100%; border-radius: 8px; }
      .preview-acoes-card { padding: 16px; border-radius: 12px; }
    }
  </style>
</head>
<body>
  <header class="cabecalho">
    <div class="container wrap">
      <a href="/"><img src="/imagens/logo.png" class="logo" alt="Office Express" onerror="this.style.display='none'" /></a>
      <nav class="menu" id="navMenu"></nav>
      <button class="hamburguer" id="hamburguer" aria-label="Abrir menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </header>
  <div id="mobileMenu"></div>

  <div class="preview-page container">
    <div class="section-header">
      <h2>Pré-visualização</h2>
      <p>Esta é uma prévia do seu currículo no modelo <strong id="modeloNome"></strong>. Após o pagamento, você recebe o arquivo em <strong>PDF e Word</strong>.</p>
    </div>

    <div class="preview-layout">
      <div class="preview-doc-col">
        <div class="preview-paper" id="preview"></div>
      </div>

      <aside class="preview-acoes-col">
        <div class="preview-acoes-card">
          <h3>O que deseja fazer?</h3>
          <p class="sub">Revise seu currículo antes de continuar.</p>
          <div class="preview-acoes">
            <button class="btn btn-ghost" onclick="history.back()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              Editar
            </button>
            <button class="btn btn-ghost" onclick="window.location.href='/modelos'">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
              Trocar modelo
            </button>
            <button class="btn btn-primary" id="btnIrPag" onclick="irPagamento()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/></svg>
              Continuar para pagamento
            </button>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <footer class="footer"><div class="container"><p>&copy; <span id="ano"></span> Office Express</p></div></footer>

  <script src="/assets/app.js"></script>
  <script>
    document.getElementById("ano").textContent = new Date().getFullYear();
    App.carregarHeader("preview");

    var modelo = localStorage.getItem("modeloSelecionado") || "classico";
    var dados = {};
    try { dados = JSON.parse(localStorage.getItem("curriculo") || "{}"); } catch (e) {}

    App.api("/api/modelos").then(function (r) {
      if (r.ok) {
        var m = r.data.modelos.find(function (x) { return x.id === modelo; });
        document.getElementById("modeloNome").textContent = m ? m.nome : "Clássico";
      }
    });

    // Renderiza usando o MESMO template do PDF (fonte única de verdade).
    function render() {
      var preview = document.getElementById("preview");
      if (!window.renderCurriculo) {
        preview.innerHTML = '<p>Carregando pré-visualização…</p>';
        return;
      }
      var html = window.renderCurriculo.gerarHTML(modelo, dados);
      var doc = new DOMParser().parseFromString(html, "text/html");
      var styleEl = doc.querySelector("style");
      var pageEl = doc.querySelector(".page");
      if (!pageEl) return;
      // O CSS de cada modelo é escopado por ".modelo-<id>" (ex.: .modelo-moderno .lateral).
      // Mantemos essa classe no wrapper para o preview aplicar EXATAMENTE o estilo do modelo.
      preview.innerHTML =
        '<div class="preview-doc">' +
        (styleEl ? styleEl.outerHTML : "") +
        '<div class="modelo-' + modelo + '"><div class="page">' + pageEl.innerHTML + '</div></div>' +
        '</div>';
      dimensionarPreview();
    }

    // Escala o documento A4 (794px) para caber na largura disponível.
    function dimensionarPreview() {
      var preview = document.getElementById("preview");
      var doc = preview.querySelector(".preview-doc");
      if (!doc) return;
      var largura = preview.clientWidth || 794;
      var escala = largura / 794;
      doc.style.transform = "scale(" + escala + ")";
      doc.style.height = (doc.offsetHeight * escala) + "px";
      doc.style.transformOrigin = "top left";
    }
    window.addEventListener("resize", dimensionarPreview);

    async function irPagamento() {
      var btn = document.getElementById("btnIrPag");
      btn.disabled = true;
      // Exige login
      var u = await App.authMe();
      if (!u) {
        localStorage.setItem("redirectAposLogin", "/preview");
        window.location.href = "/login";
        return;
      }
      var { ok, data } = await App.api("/api/pedidos", {
        method: "POST",
        body: JSON.stringify({ modelo: modelo, dados: dados }),
      });
      if (ok) {
        window.location.href = "/pagamento?pedido=" + data.pedido.id;
      } else {
        alert(data.error || "Erro ao criar o pedido.");
        btn.disabled = false;
      }
    }
    window.irPagamento = irPagamento;

    render();
  </script>
</body>
</html>
