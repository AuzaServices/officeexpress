<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pré-visualização - Office Express</title>
  <link rel="icon" href="/imagens/icon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/estilo.css" />
  <style>
    .preview-paper h1 { font-size: 26px; }
    .preview-paper .pp-contato { color: #444; }
    .preview-paper h2 { color: var(--pp-cor, #00324a); }
    .preview-paper .exp-item { margin-bottom: 12px; }
    .preview-paper .exp-titulo { font-weight: 700; }
    .preview-paper .exp-periodo { color: #666; font-size: 13px; }
    .foto-circ { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid var(--pp-cor, #00324a); display: block; margin: 0 auto 16px; }
    /* Preview do PDF real (mesmo gerador do download) */
    .preview-paper { padding: 0; overflow: hidden; }
    .preview-paper #previewPdf { width: 100%; height: 1123px; border: 0; display: block; }
  </style>
</head>
<body>
  <header class="cabecalho">
    <div class="container wrap">
      <a href="/"><img src="/imagens/logo.png" class="logo" alt="Office Express" onerror="this.style.display='none'" /></a>
      <nav class="menu" id="navMenu"></nav>
      <button class="hamburguer" id="hamburguer">&#9776;</button>
    </div>
  </header>
  <div id="mobileMenu"></div>

  <div class="preview-page container">
    <div class="section-header">
      <h2>Pré-visualização</h2>
      <p>Esta é uma prévia do seu currículo no modelo <strong id="modeloNome"></strong>. Após o pagamento, você recebe o arquivo em <strong>PDF e Word</strong>.</p>
    </div>

    <div class="preview-paper" id="preview"></div>

    <div class="preview-acoes">
      <button class="btn btn-ghost" onclick="history.back()">&#8592; Editar</button>
      <button class="btn btn-ghost" onclick="window.location.href='/modelos'">Trocar modelo</button>
      <button class="btn btn-primary" id="btnIrPag" onclick="irPagamento()">Continuar para pagamento &#8594;</button>
    </div>
  </div>

  <footer class="footer"><div class="container"><p>&copy; <span id="ano"></span> Office Express</p></div></footer>

  <script src="/assets/app.js"></script>
  <script>
    var cores = {
      classico: "#00324a", moderno: "#2563eb", minimal: "#111827", profissional: "#334155",
      executivo: "#0f172a", cronologico: "#0e7490", funcional: "#4d7c0f", compacto: "#1f2937",
      soberio: "#3b2f2f", tecnico: "#1e3a8a"
    };
    document.getElementById("ano").textContent = new Date().getFullYear();
    App.carregarHeader("preview");

    var modelo = localStorage.getItem("modeloSelecionado") || "classico";
    var dados = {};
    try { dados = JSON.parse(localStorage.getItem("curriculo") || "{}"); } catch (e) {}

    App.api("/api/modelos").then(function (r) {
      if (r.ok) {
        var m = r.data.modelos.find(function (x) { return x.id === modelo; });
        document.getElementById("modeloNome").textContent = m ? m.nome : "Clássico";
      }
    });

    function render() {
      var paper = document.getElementById("preview");
      // Exibe o PDF real gerado pelo servidor (mesmo código do download),
      // garantindo que a pré-visualização seja idêntica ao arquivo final.
      paper.innerHTML = '<iframe id="previewPdf" title="Pré-visualização"></iframe>';
      fetch("/api/preview", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ modelo: modelo, dados: dados }),
      })
        .then(function (r) {
          if (!r.ok) throw new Error("Falha ao gerar o preview");
          return r.blob();
        })
        .then(function (blob) {
          document.getElementById("previewPdf").src = URL.createObjectURL(blob);
        })
        .catch(function (err) {
          paper.innerHTML = '<p style="padding:24px;color:#c0392b">Não foi possível carregar a pré-visualização.</p>';
        });
    }

    async function irPagamento() {
      var btn = document.getElementById("btnIrPag");
      btn.disabled = true;
      // Exige login
      var u = await App.authMe();
      if (!u) {
        localStorage.setItem("redirectAposLogin", "/preview");
        window.location.href = "/login";
        return;
      }
      var { ok, data } = await App.api("/api/pedidos", {
        method: "POST",
        body: JSON.stringify({ modelo: modelo, dados: dados }),
      });
      if (ok) {
        window.location.href = "/pagamento?pedido=" + data.pedido.id;
      } else {
        alert(data.error || "Erro ao criar o pedido.");
        btn.disabled = false;
      }
    }
    window.irPagamento = irPagamento;

    render();
  </script>
</body>
</html>
