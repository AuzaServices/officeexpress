<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin - Office Express</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Office Express" />
  <meta property="og:title" content="Login Admin — Office Express" />
  <meta property="og:image" content="https://i.imgur.com/1WbBM6j.jpeg" />
  <meta property="og:image:secure_url" content="https://i.imgur.com/1WbBM6j.jpeg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Login Admin — Office Express" />
  <meta name="twitter:image" content="https://i.imgur.com/1WbBM6j.jpeg" />
  <meta name="robots" content="noindex, nofollow" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Office Express" />
  <meta property="og:title" content="Login Admin — Office Express" />
  <meta property="og:image" content="https://i.imgur.com/1WbBM6j.jpeg" />
  <meta property="og:image:secure_url" content="https://i.imgur.com/1WbBM6j.jpeg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Login Admin — Office Express" />
  <meta name="twitter:image" content="https://i.imgur.com/1WbBM6j.jpeg" />
  <link rel="icon" href="/imagens/icon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/estilo.css" />
  <link rel="stylesheet" href="/assets/auth-premium.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-side">
      <img class="auth-side-img" src="/imagens/auth/admin.jpg" alt="" aria-hidden="true" onerror="this.onerror=null;this.src='/imagens/auth/login.jpg';" />
      <div class="auth-side-overlay"></div>
      <div class="auth-side-content">
        <h2 class="auth-side-headline">Painel <em>administrativo</em> seguro.</h2>
        <p class="auth-side-text">Gestão completa de usuários, empresas, pagamentos e currículos da plataforma.</p>
        <ul class="auth-side-feats">
          <li><span class="feat-ico">🔐</span>Acesso restrito à equipe</li>
          <li><span class="feat-ico">📊</span>Visão consolidada da operação</li>
          <li><span class="feat-ico">⚙️</span>Controle total da plataforma</li>
        </ul>
      </div>
    </div>
    <div class="auth-form-panel">
    <div class="auth-card">
      <a class="auth-voltar" href="/" aria-label="Voltar para a página inicial">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        Voltar ao site
      </a>

      <h1>Área restrita</h1>
      <p class="subtitle">Acesso exclusivo para administração.</p>
      <div id="alert" class="alert"></div>
      <form id="form">
        <div class="campo"><label for="username">Usuário</label><input type="text" id="username" required autocomplete="username" /></div>
        <div class="campo"><label for="password">Senha</label><input type="password" id="password" required autocomplete="current-password" /></div>
        <button type="submit" class="btn btn-primary btn-block" id="btn">Entrar</button>
      </form>
      <div class="auth-links"><p><a href="/">Voltar ao site</a></p></div>
    </div>
    </div><!-- /.auth-form-panel -->
  </div><!-- /.auth-page -->
  <script src="/assets/app.js"></script>
  <script>
    document.getElementById("form").addEventListener("submit", async function (e) {
      e.preventDefault();
      App.limparAlerta("alert");
      var username = document.getElementById("username").value;
      var password = document.getElementById("password").value;
      document.getElementById("btn").disabled = true;
      var { ok, data } = await App.api("/api/admin/login", { method: "POST", body: JSON.stringify({ username, password }) });
      document.getElementById("btn").disabled = false;
      if (ok) window.location.href = "/painel";
      else App.mostrarAlerta("alert", data.error || "Credenciais inválidas.", "error");
    });
  </script>
</body>
</html>
