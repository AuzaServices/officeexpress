<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: #eee; font-family: 'Segoe UI', sans-serif; }
    main { padding: 100px 24px; }
  </style>
</head>
<body>
  <header class="cabecalho">
    <div class="container">
      <div class="wrap">
        <a href="/" class="logo-link" aria-label="Início">
          <img src="https://i.imgur.com/HjzGCoA.png" alt="Office Express" class="logo" />
        </a>
        <nav class="menu">
          <a href="/contato">Contato</a>
          <a href="/sobre">Sobre nós</a>
        </nav>
        <a href="/pagamento" class="carrinho-link" id="carrinhoLink" aria-label="Meu carrinho" title="Meu carrinho">
          <svg class="carrinho-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="carrinho-badge" id="carrinhoBadge">1</span>
        </a>
        <button class="hamburguer" id="btnMenu" aria-label="Abrir menu" aria-expanded="false">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </header>
  <main><h1>Teste header</h1></main>
</body>
</html>
