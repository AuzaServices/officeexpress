<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir senha - Office Express</title>
  <link rel="icon" href="/imagens/icon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/estilo.css" />
  <link rel="stylesheet" href="/assets/auth-premium.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-side">
      <img class="auth-side-img" src="/imagens/auth/senha.jpg" alt="" aria-hidden="true" onerror="this.onerror=null;this.src='/imagens/auth/login.jpg';" />
      <div class="auth-side-overlay"></div>
      <div class="auth-side-content">
        <h2 class="auth-side-headline">Defina sua <em>nova senha</em>.</h2>
        <p class="auth-side-text">Escolha uma senha forte para manter sua conta e seus currículos sempre protegidos.</p>
        <ul class="auth-side-feats">
          <li><span class="feat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>Conexão segura</li>
          <li><span class="feat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></span>Confirmação imediata</li>
          <li><span class="feat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg></span>Sua conta sempre protegida</li>
        </ul>
      </div>
    </div>
    <div class="auth-form-panel">
    <div class="auth-card">
      <a class="auth-voltar" href="/" aria-label="Voltar para a página inicial">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        Voltar ao site
      </a>

      <h1>Redefinir senha</h1>
      <p class="subtitle">Escolha uma nova senha para sua conta.</p>

      <div id="alert" class="alert"></div>

      <form id="form">
        <div class="campo">
          <label for="senha">Nova senha</label>
          <input type="password" id="senha" required placeholder="Mínimo 8 caracteres com letras e números" autocomplete="new-password" />
        </div>
        <div class="campo">
          <label for="senha2">Confirmar nova senha</label>
          <input type="password" id="senha2" required placeholder="Repita a senha" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btnSalvar">Salvar nova senha</button>
      </form>

      <div class="auth-links"><p><a href="/login">Voltar ao login</a></p></div>
    </div>
    </div><!-- /.auth-form-panel -->
  </div><!-- /.auth-page -->

  <script src="/assets/app.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get("token");
    if (!token) App.mostrarAlerta("alert", "Link inválido. Solicite novamente.", "error");

    document.getElementById("form").addEventListener("submit", async function (e) {
      e.preventDefault();
      App.limparAlerta("alert");
      if (!token) return;
      const senha = document.getElementById("senha").value;
      const senha2 = document.getElementById("senha2").value;
      if (senha !== senha2) return App.mostrarAlerta("alert", "As senhas não coincidem.", "error");
      document.getElementById("btnSalvar").disabled = true;
      const { ok, data } = await App.api("/api/auth/redefinir-senha", {
        method: "POST",
        body: JSON.stringify({ token, senha }),
      });
      document.getElementById("btnSalvar").disabled = false;
      if (ok) {
        App.mostrarAlerta("alert", "Senha redefinida! Redirecionando...", "success");
        setTimeout(() => (window.location.href = "/login"), 1800);
      } else {
        App.mostrarAlerta("alert", data.error || "Erro ao redefinir senha.", "error");
      }
    });
  </script>
</body>
</html>
