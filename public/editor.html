<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preencha seu currículo - Office Express</title>
  <link rel="icon" href="/imagens/icon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/estilo.css" />
  <style>
    .editor-wrap { max-width: 760px; margin: 0 auto; }
    .nav-steps { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
    .etapa { display: none; }
    .etapa.ativa { display: block; animation: fadeInUp .3s ease; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .foto-preview { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid var(--brand); margin-top: 8px; display: none; }
    .info-banner { background: rgba(255,136,0,0.12); border: 1px solid rgba(255,136,0,0.4); border-radius: 12px; padding: 14px 18px; margin-bottom: 24px; color: var(--text-secondary); font-size: .9rem; }
  </style>
</head>
<body>
  <header class="cabecalho">
    <div class="container wrap">
      <a href="/"><img src="/imagens/logo.png" class="logo" alt="Office Express" onerror="this.style.display='none'" /></a>
      <nav class="menu" id="navMenu"></nav>
      <button class="hamburguer" id="hamburguer">&#9776;</button>
    </div>
  </header>
  <div id="mobileMenu"></div>

  <section class="section container">
    <div class="editor-wrap">
      <div class="section-header">
        <h2>Preencha seus dados</h2>
        <p>Seu currículo é gerado automaticamente ao final. Você pode visualizar antes de pagar.</p>
      </div>

      <div class="info-banner" id="modeloInfo"></div>

      <div class="steps" id="steps"></div>

      <!-- ETAPA 1: Pessoal -->
      <div class="etapa card" id="etapa0">
        <h3>Informações pessoais</h3>
        <div class="campo">
          <label for="nome">Nome completo *</label>
          <input type="text" id="nome" placeholder="Maria da Silva" />
        </div>
        <div class="campo">
          <label for="foto">Foto (opcional)</label>
          <input type="file" id="foto" accept="image/*" />
          <img id="fotoPreview" class="foto-preview" alt="Pré-visualização da foto" />
        </div>
        <div class="campo">
          <label for="idade">Idade (opcional)</label>
          <input type="number" id="idade" min="1" max="120" placeholder="28" />
        </div>
      </div>

      <!-- ETAPA 2: Contato e endereço -->
      <div class="etapa card" id="etapa1">
        <h3>Contato e endereço</h3>
        <div class="campo">
          <label for="email">E-mail *</label>
          <input type="email" id="email" placeholder="voce@email.com" />
        </div>
        <div class="campo">
          <label>Telefones</label>
          <div id="telefones"></div>
          <button type="button" class="add-btn" onclick="addTelefone()">+ Adicionar telefone</button>
        </div>
        <div class="campo">
          <label for="endereco">Rua/Avenida</label>
          <input type="text" id="endereco" placeholder="Rua das Flores" />
        </div>
        <div class="campo">
          <label for="numero">Número (opcional)</label>
          <input type="text" id="numero" placeholder="123" />
        </div>
        <div class="campo">
          <label for="bairro">Bairro</label>
          <input type="text" id="bairro" placeholder="Centro" />
        </div>
        <div class="campo">
          <label for="cidade">Cidade *</label>
          <input type="text" id="cidade" placeholder="São Paulo" />
        </div>
        <div class="campo">
          <label for="estado">Estado *</label>
          <select id="estado">
            <option value="">Selecione</option>
            <option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>BA</option>
            <option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option>
            <option>MT</option><option>MS</option><option>MG</option><option>PA</option><option>PB</option>
            <option>PR</option><option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
            <option>RS</option><option>RO</option><option>RR</option><option>SC</option><option>SP</option>
            <option>SE</option><option>TO</option>
          </select>
        </div>
      </div>

      <!-- ETAPA 3: Objetivo e formação -->
      <div class="etapa card" id="etapa2">
        <h3>Objetivo e formação</h3>
        <div class="campo">
          <label for="objetivo">Objetivo profissional *</label>
          <textarea id="objetivo" placeholder="Busco uma posição como Analista, onde possa aplicar minha experiência em..."></textarea>
        </div>
        <div class="campo">
          <label for="formacao">Formação acadêmica *</label>
          <textarea id="formacao" placeholder="Graduação em Administração - Universidade X (2015-2019)"></textarea>
        </div>
      </div>

      <!-- ETAPA 4: Cursos -->
      <div class="etapa card" id="etapa3">
        <h3>Cursos e certificações</h3>
        <div id="cursos"></div>
        <button type="button" class="add-btn" onclick="addCurso()">+ Adicionar curso</button>
      </div>

      <!-- ETAPA 5: Experiências -->
      <div class="etapa card" id="etapa4">
        <h3>Experiência profissional</h3>
        <div class="campo">
          <label><input type="checkbox" id="primeiroEmprego" style="width:auto;margin-right:8px" /> É meu primeiro emprego</label>
        </div>
        <div id="experiencias"></div>
        <button type="button" class="add-btn" id="btnAddExp" onclick="addExperiencia()">+ Adicionar experiência</button>
      </div>

      <!-- ETAPA 6: Habilidades -->
      <div class="etapa card" id="etapa5">
        <h3>Habilidades e interesses</h3>
        <div class="campo">
          <label for="habilidades">Habilidades (separadas por vírgula)</label>
          <textarea id="habilidades" placeholder="Excel, Pacote Office, Comunicação, Liderança"></textarea>
        </div>
        <div class="campo">
          <label for="hobbies">Hobbies (opcional)</label>
          <textarea id="hobbies" placeholder="Leitura, esportes, voluntariado"></textarea>
        </div>
        <div class="campo">
          <label for="infoAdicional">Informações adicionais (opcional)</label>
          <textarea id="infoAdicional" placeholder="CPF, CNH, disponibilidade..."></textarea>
        </div>
      </div>

      <div class="nav-steps">
        <button class="btn btn-ghost" id="btnPrev" onclick="prev()">Voltar</button>
        <button class="btn btn-primary" id="btnNext" onclick="next()">Continuar</button>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container"><p>&copy; <span id="ano"></span> Office Express</p></div>
  </footer>

  <script src="/assets/app.js"></script>
  <script>
    var etapaAtual = 0;
    var totalEtapas = 6;
    var modelo = localStorage.getItem("modeloSelecionado") || "classico";
    var nomeModelo = localStorage.getItem("modeloNome") || "";

    document.getElementById("ano").textContent = new Date().getFullYear();
    App.carregarHeader("editor");

    // Mostra o nome do modelo selecionado
    App.api("/api/modelos").then(function (r) {
      if (r.ok) {
        var m = r.data.modelos.find(function (x) { return x.id === modelo; });
        if (m) {
          nomeModelo = m.nome;
          localStorage.setItem("modeloNome", m.nome);
          document.getElementById("modeloInfo").innerHTML = "Modelo selecionado: <strong>" + m.nome + "</strong> &mdash; " + m.descricao;
        }
      }
    });

    function renderSteps() {
      var s = document.getElementById("steps");
      s.innerHTML = "";
      for (var i = 0; i < totalEtapas; i++) {
        var d = document.createElement("div");
        d.className = "step-dot" + (i === etapaAtual ? " active" : "");
        d.textContent = (i + 1);
        s.appendChild(d);
      }
    }
    function showEtapa(n) {
      for (var i = 0; i < totalEtapas; i++) document.getElementById("etapa" + i).classList.toggle("ativa", i === n);
      document.getElementById("btnPrev").style.visibility = n === 0 ? "hidden" : "visible";
      document.getElementById("btnNext").textContent = n === totalEtapas - 1 ? "Ver prévia" : "Continuar";
      renderSteps();
    }
    window.prev = function () { if (etapaAtual > 0) { etapaAtual--; showEtapa(etapaAtual); } };
    window.next = function () {
      if (etapaAtual < totalEtapas - 1) { etapaAtual++; showEtapa(etapaAtual); }
      else salvarEIrPreview();
    };

    // Foto
    document.getElementById("foto").addEventListener("change", function (e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (ev) {
        var img = document.getElementById("fotoPreview");
        img.src = ev.target.result;
        img.style.display = "block";
      };
      reader.readAsDataURL(file);
    });

    // Telefones
    function addTelefone(val) {
      var d = document.createElement("div");
      d.style.marginBottom = "10px";
      d.innerHTML = '<input type="tel" class="tel" placeholder="(11) 99999-9999" value="' + (val || "") + '" />';
      document.getElementById("telefones").appendChild(d);
    }
    window.addTelefone = function () { addTelefone(); };

    // Cursos
    function addCurso() {
      var d = document.createElement("div");
      d.className = "repeat-item";
      d.innerHTML =
        '<button type="button" class="remover" onclick="this.parentElement.remove()">&#10005; Remover</button>' +
        '<div class="campo"><label>Curso *</label><input class="c-curso" placeholder="Pacote Office" /></div>' +
        '<div class="campo"><label>Instituição</label><input class="c-inst" placeholder="SENAI" /></div>' +
        '<div class="campo"><label>Carga horária</label><input class="c-carga" placeholder="40h" /></div>';
      document.getElementById("cursos").appendChild(d);
    }
    window.addCurso = addCurso;

    // Experiências
    function addExperiencia() {
      var d = document.createElement("div");
      d.className = "repeat-item";
      d.innerHTML =
        '<button type="button" class="remover" onclick="this.parentElement.remove()">&#10005; Remover</button>' +
        '<div class="campo"><label>Empresa *</label><input class="e-empresa" placeholder="Nome da empresa" /></div>' +
        '<div class="campo"><label>Cargo</label><input class="e-cargo" placeholder="Analista" /></div>' +
        '<div class="campo" style="display:flex;gap:12px">' +
        '  <div style="flex:1"><label>Início</label><input class="e-inicio" placeholder="01/2020" /></div>' +
        '  <div style="flex:1"><label>Fim</label><input class="e-fim" placeholder="01/2023" /></div>' +
        '</div>' +
        '<div class="campo"><label>Atividades</label><textarea class="e-ativ" placeholder="Descreva suas principais atividades"></textarea></div>';
      document.getElementById("experiencias").appendChild(d);
    }
    window.addExperiencia = addExperiencia;

    document.getElementById("primeiroEmprego").addEventListener("change", function (e) {
      var disabled = e.target.checked;
      document.getElementById("experiencias").style.display = disabled ? "none" : "block";
      document.getElementById("btnAddExp").style.display = disabled ? "none" : "inline-flex";
    });

    function getArray(sel) {
      return Array.prototype.map.call(document.querySelectorAll(sel), function (el) { return el.value.trim(); });
    }

    function salvarEIrPreview() {
      var dados = {
        nome: document.getElementById("nome").value.trim(),
        idade: document.getElementById("idade").value,
        email: document.getElementById("email").value.trim(),
        telefone: getArray(".tel"),
        endereco: document.getElementById("endereco").value.trim(),
        numero: document.getElementById("numero").value.trim(),
        bairro: document.getElementById("bairro").value.trim(),
        cidade: document.getElementById("cidade").value.trim(),
        estado: document.getElementById("estado").value,
        objetivo: document.getElementById("objetivo").value.trim(),
        formacao: document.getElementById("formacao").value.trim(),
        habilidades: document.getElementById("habilidades").value.trim(),
        hobbies: document.getElementById("hobbies").value.trim(),
        infoAdicional: document.getElementById("infoAdicional").value.trim(),
        primeiroEmprego: document.getElementById("primeiroEmprego").checked,
        curso: getArray(".c-curso"),
        instituicao: getArray(".c-inst"),
        carga: getArray(".c-carga"),
        empresa: getArray(".e-empresa"),
        cargo: getArray(".e-cargo"),
        periodo_inicio: getArray(".e-inicio"),
        periodo_fim: getArray(".e-fim"),
        atividades: getArray(".e-ativ"),
        foto: document.getElementById("fotoPreview").src || ""
      };
      if (!dados.nome) { alert("Informe seu nome completo."); etapaAtual = 0; showEtapa(0); return; }
      if (!dados.email) { alert("Informe seu e-mail de contato."); etapaAtual = 1; showEtapa(1); return; }
      if (!dados.objetivo) { alert("Informe seu objetivo profissional."); etapaAtual = 2; showEtapa(2); return; }
      localStorage.setItem("curriculo", JSON.stringify(dados));
      window.location.href = "/preview";
    }

    // Preenche com dados salvos, se existirem
    try {
      var prev = JSON.parse(localStorage.getItem("curriculo") || "{}");
      if (prev.nome) document.getElementById("nome").value = prev.nome;
      if (prev.idade) document.getElementById("idade").value = prev.idade;
      if (prev.email) document.getElementById("email").value = prev.email;
      if (prev.endereco) document.getElementById("endereco").value = prev.endereco;
      if (prev.numero) document.getElementById("numero").value = prev.numero;
      if (prev.bairro) document.getElementById("bairro").value = prev.bairro;
      if (prev.cidade) document.getElementById("cidade").value = prev.cidade;
      if (prev.estado) document.getElementById("estado").value = prev.estado;
      if (prev.objetivo) document.getElementById("objetivo").value = prev.objetivo;
      if (prev.formacao) document.getElementById("formacao").value = prev.formacao;
      if (prev.habilidades) document.getElementById("habilidades").value = prev.habilidades;
      if (prev.hobbies) document.getElementById("hobbies").value = prev.hobbies;
      if (prev.infoAdicional) document.getElementById("infoAdicional").value = prev.infoAdicional;
      document.getElementById("primeiroEmprego").checked = !!prev.primeiroEmprego;
      (prev.telefone || []).forEach(addTelefone);
      (prev.curso || []).forEach(function (_, i) {
        addCurso();
        var itens = document.querySelectorAll("#cursos .repeat-item");
        var it = itens[itens.length - 1];
        it.querySelector(".c-curso").value = prev.curso[i] || "";
        it.querySelector(".c-inst").value = (prev.instituicao && prev.instituicao[i]) || "";
        it.querySelector(".c-carga").value = (prev.carga && prev.carga[i]) || "";
      });
      (prev.empresa || []).forEach(function (_, i) {
        addExperiencia();
        var itens = document.querySelectorAll("#experiencias .repeat-item");
        var it = itens[itens.length - 1];
        it.querySelector(".e-empresa").value = prev.empresa[i] || "";
        it.querySelector(".e-cargo").value = (prev.cargo && prev.cargo[i]) || "";
        it.querySelector(".e-inicio").value = (prev.periodo_inicio && prev.periodo_inicio[i]) || "";
        it.querySelector(".e-fim").value = (prev.periodo_fim && prev.periodo_fim[i]) || "";
        it.querySelector(".e-ativ").value = (prev.atividades && prev.atividades[i]) || "";
      });
      if (prev.foto) { document.getElementById("fotoPreview").src = prev.foto; document.getElementById("fotoPreview").style.display = "block"; }
      document.getElementById("primeiroEmprego").dispatchEvent(new Event("change"));
    } catch (e) {}

    showEtapa(0);
  </script>
</body>
</html>
