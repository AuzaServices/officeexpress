<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar senha - Office Express</title>
  <link rel="icon" href="/imagens/icon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/estilo.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo"><img src="/imagens/logo.png" alt="Office Express" onerror="this.style.display='none'" /></div>
      <h1>Recuperar senha</h1>
      <p class="subtitle">Enviaremos um link para você redefinir sua senha.</p>

      <div id="alert" class="alert"></div>

      <form id="form">
        <div class="campo">
          <label for="email">E-mail cadastrado</label>
          <input type="email" id="email" required placeholder="voce@email.com" autocomplete="email" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btnEnviar">Enviar link</button>
      </form>

      <div class="auth-links"><p><a href="/login">Voltar ao login</a></p></div>
    </div>
  </div>

  <script src="/assets/app.js"></script>
  <script>
    document.getElementById("form").addEventListener("submit", async function (e) {
      e.preventDefault();
      App.limparAlerta("alert");
      const email = document.getElementById("email").value.trim();
      document.getElementById("btnEnviar").disabled = true;
      const { ok, data } = await App.api("/api/auth/esqueci-senha", {
        method: "POST",
        body: JSON.stringify({ email }),
      });
      document.getElementById("btnEnviar").disabled = false;
      App.mostrarAlerta("alert", data.message || "Verifique seu e-mail.", ok ? "success" : "error");
    });
  </script>
</body>
</html>
