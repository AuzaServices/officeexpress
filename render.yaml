services:
  - type: web
    name: officeexpress
    env: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node server.js"
    envVars:
      NODE_VERSION: 20
      # O Chromium (usado para gerar o PDF a partir do mesmo HTML do preview) é
      # baixado durante o build e usado no runtime. Usamos um caminho RELATIVO
      # ($PWD no build = __dirname no runtime, via lib/pdf.js), então funciona
      # independentemente do "Root Directory" configurado no painel do Render
      # (ex.: o código pode estar em /opt/render/project/src).
      MP_ACCESS_TOKEN: "APP_USR-8737077259739135-080819-61f63c19c38d6eef485c04c2efd226f4-2659262227"
      MP_PUBLIC_KEY: "APP_USR-2a71602b-25c9-4bff-9954-b917273d5b7f"
      MP_CLIENT_ID: "8737077259739135"
      MP_CLIENT_SECRET: "HAiu3lCRawlubUkM1XqhuXDJHcC5nU8S"
